<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Ozzy & Addi | 💚</title>

    <!-- iOS / PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ozzy & Addi">
    <meta name="theme-color" content="#2ecc71">
    <meta name="description" content="Ozzy and Addi | The best couple of all time">

    <!-- Apple Touch Icon (Pure Solid Green Icon - No Shapes or Icons) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' fill='%232ecc71'/></svg>">
    
    <!-- Dynamic Web App Manifest Injection with Pure Solid Green Icon -->
    <script>
        (function() {
            const solidGreenIcon = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' fill='%232ecc71'/></svg>";
            
            const manifest = {
                "name": "Ozzy & Addi",
                "short_name": "Ozzy & Addi",
                "description": "Best Couple Of All Time • Ozzy and Addi",
                "start_url": "./",
                "display": "standalone",
                "background_color": "#03120a",
                "theme_color": "#2ecc71",
                "orientation": "portrait",
                "icons": [
                    {
                        "src": solidGreenIcon,
                        "sizes": "192x192 512x512",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    }
                ]
            };
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldDark: '#03120a',
                        emeraldDeep: '#0b2618',
                        emeraldCard: '#0e3320',
                        emeraldAccent: '#2ecc71',
                        emeraldGlow: '#4cd98b',
                        mintLight: '#e8fceb',
                    },
                    fontFamily: {
                        clarity: ['"Clarity City"', '"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        @font-face {
            font-family: 'Clarity City';
            src: local('Clarity City'), local('ClarityCity-Bold'),
                 url('https://cdn.jsdelivr.net/npm/@vmware/clarity-city/fonts/ClarityCity-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Clarity City';
            src: local('Clarity City Medium'), local('ClarityCity-Medium'),
                 url('https://cdn.jsdelivr.net/npm/@vmware/clarity-city/fonts/ClarityCity-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        /* DISABLE TEXT SELECTION & MOBILE COPY/SELECT CALLOUTS */
        *, ::before, ::after {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        body {
            background-color: #03120a;
            background-image: 
                radial-gradient(at 15% 15%, rgba(46, 204, 113, 0.22) 0px, transparent 45%),
                radial-gradient(at 85% 85%, rgba(76, 217, 139, 0.18) 0px, transparent 45%),
                radial-gradient(at 50% 50%, rgba(3, 18, 10, 0.96) 0px, transparent 100%);
            background-attachment: fixed;
            color: #e8fceb;
            min-height: 100vh;
        }

        .clarity-title {
            font-family: 'Clarity City', 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Glassmorphism Green Romantic Cards */
        .glass-card {
            background: rgba(11, 38, 24, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(76, 217, 139, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(46, 204, 113, 0.18);
        }

        .glow-text {
            text-shadow: 0 0 18px rgba(76, 217, 139, 0.75);
        }

        /* Background floating hearts canvas */
        #heartCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between min-h-screen font-sans overflow-x-hidden">

    <!-- Floating Green Hearts Particles Canvas -->
    <canvas id="heartCanvas"></canvas>

    <div class="relative z-10 flex flex-col min-h-screen justify-between py-8 px-4 max-w-4xl mx-auto w-full">
        
        <header class="text-center pt-2 pb-2">
            <!-- Install Button Bar -->
            <div id="installContainer" class="hidden mb-4">
                <button id="installAppBtn" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-emeraldAccent text-emeraldDark font-bold text-sm shadow-lg shadow-emeraldAccent/30 hover:scale-105 active:scale-95 transition-all duration-300">
                    <i class="fa-solid fa-download"></i>
                    <span>Install App</span>
                </button>
            </div>

            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emeraldDeep/90 border border-emeraldGlow/40 shadow-lg mb-4">
                <i class="fa-solid fa-heart text-emeraldGlow text-xs animate-pulse"></i>
                <span class="text-xs uppercase tracking-widest text-emeraldGlow font-semibold">Forever Together</span>
                <i class="fa-solid fa-heart text-emeraldGlow text-xs animate-pulse"></i>
            </div>

            <!-- Main App Header in Clarity City Font -->
            <h1 class="clarity-title text-5xl md:text-7xl text-white glow-text mb-2">
                Ozzy <span class="text-emeraldGlow">&amp;</span> Addi
            </h1>
            
            <p class="text-emeraldAccent text-sm md:text-base font-medium tracking-wide">
                The Best Couple Of All Time • Continuous &amp; Endless
            </p>
        </header>

        <main class="w-full space-y-8 my-6">
            
            <!-- Main Live Counter Card -->
            <div class="glass-card rounded-3xl p-6 md:p-10 text-center relative overflow-hidden">
                <div class="flex items-center justify-center gap-3 mb-6">
                    <i class="fa-solid fa-leaf text-emeraldGlow text-xl"></i>
                    <h2 class="clarity-title text-xl md:text-2xl font-semibold uppercase tracking-wider text-white">
                        Time Together
                    </h2>
                    <i class="fa-solid fa-leaf text-emeraldGlow text-xl"></i>
                </div>

                <!-- Counter Display Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                    <div class="bg-emeraldDark/80 border border-emeraldGlow/30 rounded-2xl p-4 flex flex-col items-center justify-center shadow-inner">
                        <span id="days" class="clarity-title text-4xl md:text-5xl font-bold text-white glow-text mb-1">0</span>
                        <span class="text-xs text-emeraldGlow uppercase tracking-widest font-semibold">Days</span>
                    </div>

                    <div class="bg-emeraldDark/80 border border-emeraldGlow/30 rounded-2xl p-4 flex flex-col items-center justify-center shadow-inner">
                        <span id="hours" class="clarity-title text-4xl md:text-5xl font-bold text-white glow-text mb-1">00</span>
                        <span class="text-xs text-emeraldGlow uppercase tracking-widest font-semibold">Hours</span>
                    </div>

                    <div class="bg-emeraldDark/80 border border-emeraldGlow/30 rounded-2xl p-4 flex flex-col items-center justify-center shadow-inner">
                        <span id="minutes" class="clarity-title text-4xl md:text-5xl font-bold text-white glow-text mb-1">00</span>
                        <span class="text-xs text-emeraldGlow uppercase tracking-widest font-semibold">Minutes</span>
                    </div>

                    <div class="bg-emeraldDark/80 border border-emeraldGlow/30 rounded-2xl p-4 flex flex-col items-center justify-center shadow-inner">
                        <span id="seconds" class="clarity-title text-4xl md:text-5xl font-bold text-white glow-text mb-1">00</span>
                        <span class="text-xs text-emeraldGlow uppercase tracking-widest font-semibold">Seconds</span>
                    </div>
                </div>
            </div>

            <!-- Embedded Spotify Playlist Card -->
            <div class="glass-card rounded-3xl p-6 md:p-8">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-spotify text-emeraldGlow text-2xl"></i>
                        <h3 class="clarity-title text-lg md:text-xl text-white">Our Playlist</h3>
                    </div>
                    <a href="https://open.spotify.com/playlist/1DwrsHc06XCuSeytEZDMQG?si=HNsKLHjMTLuxr1WOTjApnw" target="_blank" rel="noopener noreferrer" class="text-xs text-emeraldGlow hover:underline flex items-center gap-1 font-semibold">
                        <span>Open in Spotify</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                </div>

                <div class="w-full rounded-2xl overflow-hidden border border-emeraldGlow/30 shadow-lg bg-emeraldDark">
                    <iframe style="border-radius:12px" 
                        src="https://open.spotify.com/embed/playlist/1DwrsHc06XCuSeytEZDMQG?utm_source=generator&theme=0" 
                        width="100%" 
                        height="352" 
                        frameBorder="0" 
                        allowfullscreen="" 
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                        loading="lazy">
                    </iframe>
                </div>
            </div>

            <!-- Photo Album Direct Link -->
            <div class="text-center max-w-md mx-auto">
                <a href="https://drive.proton.me/urls/B35ETS3AER#vEtWuanMmmUz" target="_blank" rel="noopener noreferrer"
                   class="group relative inline-flex items-center justify-center w-full px-8 py-4 text-base font-bold text-emeraldDark bg-emeraldAccent hover:bg-emeraldGlow rounded-2xl shadow-xl transition-all duration-300 transform active:scale-98">
                    <span class="flex items-center gap-3">
                        <i class="fa-solid fa-images text-lg"></i>
                        <span class="clarity-title">View Shared Photo Album</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </span>
                </a>
            </div>

        </main>

        <footer class="text-center py-4 text-xs text-emeraldAccent/60">
            <p>
                Ozzy &amp; Addi • Forever in Love
            </p>
        </footer>
    </div>

    <script>
        // Anniversary Start Date: Aug 1, 2026, 11:50:01 PM CDT
        const startDate = new Date('2026-08-01T23:50:01-05:00').getTime();

        function updateCounter() {
            const now = new Date().getTime();
            const difference = now - startDate;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            }
        }

        updateCounter();
        setInterval(updateCounter, 1000);

        // Prevent context menus on tap/hold across the entire document
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Inline Service Worker setup via Blob
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'ozzy-addi-pwa-v3';
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (e) => {
                    return self.clients.claim();
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        fetch(e.request).catch(() => caches.match(e.request))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(() => console.log('SW Registered'))
                .catch(err => console.log('SW Registration error:', err));
        }

        // PWA Install Prompt handler
        let deferredPrompt;
        const installContainer = document.getElementById('installContainer');
        const installAppBtn = document.getElementById('installAppBtn');

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if (!isStandalone) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installContainer.classList.remove('hidden');
            });

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS && !isStandalone) {
                installContainer.classList.remove('hidden');
                installAppBtn.innerHTML = '<i class="fa-solid fa-plus"></i><span>Add to Home Screen (Safari Menu)</span>';
                installAppBtn.addEventListener('click', () => {
                    alert('To install on iPhone/iPad:\n1. Tap the Share button at the bottom of Safari.\n2. Scroll down and tap "Add to Home Screen".');
                });
            } else {
                installAppBtn.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        if (outcome === 'accepted') {
                            installContainer.classList.add('hidden');
                        }
                        deferredPrompt = null;
                    }
                });
            }
        }

        // Green Floating Hearts Canvas Animation
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class GreenHeart {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 20 + Math.random() * 40;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 1.2 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.fadeSpeed = Math.random() * 0.002 + 0.001;
                this.hue = Math.random() * 35 + 135; // Emerald Green spectrum
            }

            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.02) * this.speedX;
                this.opacity -= this.fadeSpeed;

                if (this.y < -30 || this.opacity <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.size / 10, this.size / 10);
                ctx.fillStyle = `hsla(${this.hue}, 85%, 60%, ${this.opacity})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `hsl(${this.hue}, 85%, 45%)`;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-5, -5, -10, 2, 0, 10);
                ctx.bezierCurveTo(10, 2, 5, -5, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        const heartParticles = Array.from({ length: 35 }, () => new GreenHeart());

        function animateHearts() {
            ctx.clearRect(0, 0, width, height);
            heartParticles.forEach(heart => {
                heart.update();
                heart.draw();
            });
            requestAnimationFrame(animateHearts);
        }

        window.onload = function() {
            animateHearts();
        };
    </script>
</body>
</html>
